name: macOS Connector Acceptance
on:
  workflow_dispatch:
jobs:
  macos-acceptance:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            arch: arm64
            package: Consulting-Intelligence-Connector-macOS-arm64-1.0.10.zip
            sha256: 367538920d2e0ffc75c2aafd9794ead4f065a0310f2f0e6e033fe6878c6618ca
          - os: macos-26-intel
            arch: x86_64
            package: Consulting-Intelligence-Connector-macOS-x64-1.0.10.zip
            sha256: a4fc0655d5dbfeb97dbd2bdde1dd1a192f974dd55f7121f989d1c648912984cf
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download matching candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ matrix.package }}
          EXPECTED_SHA256: ${{ matrix.sha256 }}
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          gh release download connector-macos-candidate-1.0.10 --repo chenxiangduo/guwenos-connector-downloads --pattern "$PACKAGE"
          echo "$EXPECTED_SHA256  $PACKAGE" | shasum -a 256 -c -
          unzip -q "$PACKAGE"
          test -f connector/manifest.json
          test -x connector/Install.command
          test -x connector/runtime/node/bin/node
      - name: Install and start Connector
        run: |
          bash connector/installer/install-connector-macos.sh connector
          sleep 8
          test -f "$HOME/Library/LaunchAgents/com.guwenos.connector.plist"
          launchctl list | grep com.guwenos.connector
          curl -fsS http://127.0.0.1:48121/health | tee connector-health.json
          node -e 'const h=require("./connector-health.json"); if(h.ready!==true||h.protocolRange?.min>1||h.protocolRange?.max<1) process.exit(1)'
      - name: Exercise native macOS host
        run: |
          STATE="$HOME/Library/Application Support/ConsultingIntelligenceOS/connector-state"
          printf '%s\n' '{"requestId":"ci-root-inspect","op":"root-inspect","rootPath":"/Users/runner"}' | "$HOME/Library/Application Support/ConsultingIntelligenceOS/Connector/1.0.10/apps/local-connector/host/connector-host" --state-dir "$STATE" > native-host.jsonl
          node -e 'const fs=require("node:fs");const r=fs.readFileSync("native-host.jsonl","utf8").trim().split(/\n/).map(JSON.parse).find(x=>x.requestId==="ci-root-inspect");if(!r?.ok)process.exit(1)'
      - name: Stop Connector cleanly
        if: always()
        run: node "$HOME/Library/Application Support/ConsultingIntelligenceOS/Connector/1.0.10/installer/control-connector.mjs" stop || true