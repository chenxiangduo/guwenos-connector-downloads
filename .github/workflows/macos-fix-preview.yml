name: macOS Clock Fix Preview
on:
  workflow_dispatch:
jobs:
  full-user-flow:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            arch: arm64
            package: Consulting-Intelligence-Connector-macOS-arm64-1.0.10.zip
            sha256: 7a1b4e272eb9016e61ed5f2465768457097c5f01895b1f2058afffe8a3c29658
          - os: macos-26-intel
            arch: x86_64
            package: Consulting-Intelligence-Connector-macOS-x64-1.0.10.zip
            sha256: 30d68c798b19faef602e578a3280c32eaadfb57bc3c8d6688692e6840f82ec3c
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install chromium
      - name: Create synthetic experience account and download Connector
        env:
          PACKAGE: ${{ matrix.package }}
          EXPECTED_SHA256: ${{ matrix.sha256 }}
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          curl -fsS -c cookies.txt -H 'Origin: https://guwenos.cn' -H 'Content-Type: application/json' -d '{}' https://guwenos.cn/auth/demo
          curl -fsSL -o "$PACKAGE" "https://github.com/chenxiangduo/guwenos-connector-downloads/releases/download/connector-macos-1.0.10/$PACKAGE"
          echo "$EXPECTED_SHA256  $PACKAGE" | shasum -a 256 -c -
          unzip -q "$PACKAGE"
      - name: Apply candidate clock-skew fix to test copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main = Path('connector/apps/local-connector/src/main.mjs')
          text = main.read_text()
          old = '    now: clock?.() ?? new Date(),\n'
          assert old in text
          main.write_text(text.replace(old, old + '    clockToleranceSeconds: 30,\n', 1))
          service = Path('connector/apps/local-connector/src/pairing/service.mjs')
          text = service.read_text()
          old = "    if (issuedAt !== undefined && dateValue(issuedAt, 'ticket issuedAt') > now()) throw pairingError('PAIRING_TICKET_INVALID', 'Pairing ticket is not active yet', 400);\n"
          new = "    if (issuedAt !== undefined && dateValue(issuedAt, 'ticket issuedAt').getTime() > now().getTime() + 30_000) throw pairingError('PAIRING_TICKET_INVALID', 'Pairing ticket is not active yet', 400);\n"
          assert old in text
          service.write_text(text.replace(old, new, 1))
          host = Path('connector/apps/local-connector/src/native/mac-host.mjs')
          text = host.read_text()
          start = text.index('function runOsascript(source) {')
          end = text.index('\n}\n\nfunction canonicalRoot', start) + 3
          replacement = '''function runOsascript(source) {
            const sourcePath = '/tmp/cio-dialog-' + process.pid + '-' + Date.now() + '.applescript';
            const resultPath = sourcePath + '.result';
            writeFileSync(sourcePath, source, 'utf8');
            const app = join(dirname(fileURLToPath(import.meta.url)), '../../../../ConnectorRunner.app');
            const result = spawnSync('open', ['-W', '-n', app, '--args', sourcePath, resultPath], { encoding: 'utf8', timeout: 290_000, maxBuffer: 64 * 1024 });
            if (result.error) throw Object.assign(new Error('无法启动系统对话框'), { code: 'NATIVE_UNAVAILABLE' });
            try { result.stdout = readFileSync(resultPath, 'utf8'); }
            catch { if (result.status === 0) result.status = 1; }
            return result;
          }'''
          host.write_text(text[:start] + replacement + text[end:])
          text = host.read_text()
          old = "  } catch (error) {\n    const code = typeof error?.code === 'string' ? error.code : 'INTERNAL_ERROR';\n"
          new = "  } catch (error) {\n    console.error(error);\n    const code = typeof error?.code === 'string' ? error.code : 'INTERNAL_ERROR';\n"
          assert old in text
          host.write_text(text.replace(old, new, 1))
          starter = Path('connector/installer/start-connector.mjs')
          text = starter.read_text()
          old = "detached: true, stdio: 'ignore', windowsHide: true"
          new = "detached: true, stdio: ['ignore', 'inherit', 'inherit'], windowsHide: true"
          assert old in text
          starter.write_text(text.replace(old, new, 1))
          transport = Path('connector/apps/local-connector/src/transport/loopback-server.mjs')
          text = transport.read_text()
          old = "      const message = statusCode >= 500 ? 'Request handler failed' : error.message;\n"
          new = "      if (statusCode >= 500) process.stderr.write(`CONNECTOR_REQUEST_FAILURE ${error?.stack ?? error} CAUSE ${error?.cause?.stack ?? error?.cause ?? ''}\\n`);\n" + old
          assert old in text
          transport.write_text(text.replace(old, new, 1))
          text = host.read_text()
          text = text.replace("  const secret = Buffer.from(secretBase64, 'base64').toString('utf8');\n", '')
          text = text.replace("'-U', '-w', secret]", "'-U', '-w', secretBase64]")
          old = "  return { refId, secretBase64: Buffer.from(result.stdout.replace(/\\n$/u, ''), 'utf8').toString('base64') };\n"
          new = "  return { refId, secretBase64: result.stdout.trim() };\n"
          assert old in text
          host.write_text(text.replace(old, new, 1))
          envelope = Path('connector/packages/licensing/src/signed-envelope.mjs')
          text = envelope.read_text()
          old = "  if (current < header.iat - clockToleranceSeconds || current >= header.exp + clockToleranceSeconds) {\n"
          new = "  process.stderr.write(`JWS_CLOCK_DEBUG ${JSON.stringify({ current, iat: header.iat, exp: header.exp, tolerance: clockToleranceSeconds })}\\n`);\n" + old
          assert old in text
          envelope.write_text(text.replace(old, new, 1))
          control = Path('connector/apps/local-connector/src/runtime/control-plane-client.mjs')
          text = control.read_text()
          text = text.replace('now: now?.() ?? new Date() });', 'now: now?.() ?? new Date(), clockToleranceSeconds: 30 });')
          text = text.replace('now: clock() });', 'now: clock(), clockToleranceSeconds: 30 });')
          assert text.count('clockToleranceSeconds: 30') == 4
          control.write_text(text)
          PY
          cat > connector/installer/dialog-runner.applescript <<'APPLET'
          on run argv
            set sourcePath to item 1 of argv
            set resultPath to item 2 of argv
            set sourceText to read POSIX file sourcePath as text
            set resultValue to run script sourceText
            set resultText to resultValue as text
            set outputFile to open for access POSIX file resultPath with write permission
            set eof outputFile to 0
            write resultText to outputFile as text
            close access outputFile
          end run
          APPLET
          osacompile -o connector/ConnectorRunner.app connector/installer/dialog-runner.applescript
      - name: Install Connector
        run: bash connector/installer/install-connector-macos.sh connector
      - name: Diagnose Connector process and listener
        run: |
          STATE="$HOME/Library/Application Support/ConsultingIntelligenceOS/connector-state"
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:48121/health; then break; fi
            sleep 1
          done
          ps aux | grep -E "main.mjs|start-connector" || true
          lsof -nP -iTCP:48121 || true
          cat "$STATE/launchagent.log" || true
          cat "$STATE/launchagent.err.log" || true
          curl -sS -i -H 'Origin: https://guwenos.cn' http://127.0.0.1:48121/health
          curl -sS -i -X OPTIONS -H 'Origin: https://guwenos.cn' -H 'Access-Control-Request-Method: GET' -H 'Access-Control-Request-Private-Network: true' http://127.0.0.1:48121/health
      - name: Verify complete user flow
        timeout-minutes: 6
        env:
          CIO_COOKIE_FILE: cookies.txt
          CIO_E2E_OUTPUT: artifacts/macos-user-flow
        run: node scripts/verify-macos-user-flow.mjs
      - name: Collect Connector logs
        if: always()
        run: |
          mkdir -p artifacts/connector-logs
          cp "$HOME/Library/Application Support/ConsultingIntelligenceOS/connector-state/"*.log artifacts/connector-logs/ 2>/dev/null || true
          launchctl list | grep com.guwenos.connector || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-user-flow-${{ matrix.arch }}
          path: |
            artifacts/macos-user-flow/
            artifacts/connector-logs/
