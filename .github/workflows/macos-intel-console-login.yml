name: Intel macOS 26 normal administrator login comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  login:
    runs-on: macos-26-intel
    timeout-minutes: 4
    steps:
      - name: Start a graphical login for a disposable test administrator
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(stat -f '%Su' /dev/console)" = "$(id -un)"
          which cliclick || brew install cliclick
          mkdir -p artifacts
          account=cioinstallqa
          password="$(/usr/bin/openssl rand -hex 10)"
          echo "::add-mask::$password"
          sudo -n /usr/sbin/sysadminctl -addUser "$account" -fullName 'Connector VM Test Administrator' -password "$password" -admin >/dev/null 2>&1
          /usr/sbin/dseditgroup -o checkmember -m "$account" admin | grep -q '^yes'
          /usr/bin/dscl . -authonly "$account" "$password" >/dev/null 2>&1
          uid=$(id -u "$account")
          sysadminctl -secureTokenStatus "$account" > artifacts/secure-token-before.txt 2>&1
          icon_service="gui/$(id -u)/com.apple.iconservices.iconservicesagent"
          launchctl bootout "$icon_service" || true
          launchctl disable "$icon_service"
          service='/System/Library/CoreServices/Menu Extras/User.menu/Contents/Resources/CGSession'
          if test -x "$service"; then
            CGSESSION_PATH="$service" QA_UID="$uid" /usr/bin/python3 - <<'PY'
          import os, subprocess
          try:
              result = subprocess.run([os.environ['CGSESSION_PATH'], '-switchToUserID', os.environ['QA_UID']], capture_output=True, timeout=15)
              print('SWITCH_COMMAND_EXIT', result.returncode)
          except subprocess.TimeoutExpired:
              print('SWITCH_COMMAND_TIMED_OUT')
          PY
          else
            echo 'Opening the system Menu Bar or Control Center configuration for Fast User Switching.'
            /usr/bin/open 'x-apple.systempreferences:com.apple.ControlCenter-Settings.extension'
            /bin/sleep 6
            /usr/bin/osascript -e 'tell application "System Events" to tell process "System Settings" to get name of windows' > artifacts/settings-window-names.txt || true
            cliclick c:907,475
            /bin/sleep 4
            /usr/sbin/screencapture -x artifacts/add-controls.png || true
            /usr/bin/osascript -e 'tell application "System Events" to get name of every application process whose frontmost is true' > artifacts/frontmost-process.txt || true
            cliclick c:713,357
            /bin/sleep 2
            /usr/sbin/screencapture -x artifacts/fast-user-switching-control.png || true
            cliclick -w 450 m:969,134 dd:969,134 dm:984,132 dm:1090,105 dm:1340,65 dm:1570,25 dm:1696,14 w:600 du:1696,14
            /bin/sleep 5
            cliclick c:1277,912
            /bin/sleep 2
            /usr/sbin/screencapture -x artifacts/menu-bar-with-switcher.png || true
            /usr/bin/osascript -e 'tell application "System Events" to tell process "ControlCenter" to get description of menu bar items of menu bar 1' > artifacts/menu-bar-controls.txt || true
            point=$(/usr/bin/osascript <<'APPLESCRIPT'
          tell application "System Events" to tell process "ControlCenter"
            set switcher to first menu bar item of menu bar 1 whose description is "User"
            set {leftEdge, topEdge} to position of switcher
            set {itemWidth, itemHeight} to size of switcher
            click switcher
            return ((leftEdge + (itemWidth div 2) - 203) as text) & ",70"
          end tell
          APPLESCRIPT
            )
            printf '%s\n' "$point" > artifacts/test-administrator-menu-point.txt
            /bin/sleep 2
            /usr/sbin/screencapture -x artifacts/fast-user-menu.png || true
            /usr/bin/osascript -e 'tell application "System Events" to tell process "ControlCenter" to get name of windows' > artifacts/fast-user-menu-windows.txt || true
            cliclick "c:$point"
            /bin/sleep 5
            /usr/sbin/screencapture -x artifacts/test-administrator-login.png
          fi
          /bin/sleep 5
          stat -f '%Su' /dev/console | tee artifacts/current-console-user.txt
          /usr/bin/python3 - <<'PY'
          import subprocess
          try:
              subprocess.run(['/usr/sbin/screencapture', '-x', 'artifacts/login-window.png'], check=True, timeout=8)
          except (subprocess.TimeoutExpired, subprocess.CalledProcessError):
              print('The test process cannot capture the system login screen.')
          PY
          /bin/launchctl print "gui/$uid" > artifacts/administrator-gui-status.txt 2>&1 || true
          launchctl enable "$icon_service" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intel-console-login-evidence
          path: artifacts/
