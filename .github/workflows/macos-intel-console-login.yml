name: Intel macOS 26 normal administrator login comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  login:
    runs-on: macos-26-intel
    timeout-minutes: 7
    steps:
      - name: Start a graphical login for a disposable test administrator
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(stat -f '%Su' /dev/console)" = "$(id -un)"
          which cliclick || brew install cliclick
          mkdir -p artifacts
          account=cioinstallqa
          password="$(/usr/bin/openssl rand -hex 10)"
          echo "::add-mask::$password"
          sudo -n /usr/sbin/sysadminctl -addUser "$account" -fullName 'Connector VM Test Administrator' -password "$password" -admin >/dev/null 2>&1
          /usr/sbin/dseditgroup -o checkmember -m "$account" admin | grep -q '^yes'
          /usr/bin/dscl . -authonly "$account" "$password" >/dev/null 2>&1
          uid=$(id -u "$account")
          sysadminctl -secureTokenStatus "$account" > artifacts/secure-token-before.txt 2>&1
          icon_service="gui/$(id -u)/com.apple.iconservices.iconservicesagent"
          launchctl bootout "$icon_service" || true
          launchctl disable "$icon_service"
          trap 'launchctl enable "$icon_service" || true' EXIT
          probe=$(mktemp -d "$RUNNER_TEMP/cio-console.XXXXXX")
          cat > "$probe/label.m" <<'OBJC'
          #import <Foundation/Foundation.h>
          #import <Vision/Vision.h>
          int main(int argc, const char *argv[]) {
            @autoreleasepool {
              if (argc != 5) return 2;
              NSURL *url = [NSURL fileURLWithPath:@(argv[1])];
              VNImageRequestHandler *handler = [[VNImageRequestHandler alloc] initWithURL:url options:@{}];
              VNRecognizeTextRequest *request = [[VNRecognizeTextRequest alloc] init];
              request.recognitionLevel = VNRequestTextRecognitionLevelAccurate;
              request.usesCPUOnly = YES;
              if (![handler performRequests:@[request] error:NULL]) return 3;
              NSString *needle = @(argv[2]);
              int minimumX = atoi(argv[3]), maximumY = atoi(argv[4]);
              for (VNRecognizedTextObservation *result in request.results) {
                NSString *text = [[result topCandidates:1] firstObject].string;
                CGRect bounds = result.boundingBox;
                int x = (int)(CGRectGetMidX(bounds) * 1920), y = (int)((1 - CGRectGetMidY(bounds)) * 1080);
                if (x >= minimumX && y <= maximumY && [text localizedCaseInsensitiveContainsString:needle]) {
                  printf("%d,%d\n", x, y);
                  return 0;
                }
              }
            }
            return 1;
          }
          OBJC
          clang -fobjc-arc -framework Foundation -framework CoreGraphics -framework Vision "$probe/label.m" -o "$probe/label"
          capture() { /usr/sbin/screencapture -x "$1"; }
          find_label() {
            /usr/bin/python3 - "$probe/label" "$@" <<'PY'
          import subprocess, sys
          try:
              result = subprocess.run(sys.argv[1:], capture_output=True, text=True, timeout=12)
          except subprocess.TimeoutExpired:
              sys.exit(1)
          print(result.stdout.strip())
          sys.exit(result.returncode)
          PY
          }
          menu_items() {
            /usr/bin/osascript -e 'tell application "System Events" to tell process "ControlCenter" to get description of menu bar items of menu bar 1'
          }
          wait_for_label() {
            local frame=$1 label=$2 minimum_x=$3 maximum_y=$4 budget=$5 deadline=$((SECONDS + $5)) point
            while (( SECONDS < deadline )); do
              if capture "$frame" && point=$(find_label "$frame" "$label" "$minimum_x" "$maximum_y"); then
                printf '%s\n' "$point"
                return
              fi
              /bin/sleep 1
            done
            printf '%s\n' "Timed out finding $label" >&2
            return 1
          }
          for destination in 1680 1660 1701; do
            echo "PREPARE_USER_SWITCH_CONTROL $destination"
            menu_items > artifacts/menu-bar-controls.txt || true
            grep -q 'User' artifacts/menu-bar-controls.txt && break
            /usr/bin/open 'x-apple.systempreferences:com.apple.ControlCenter-Settings.extension'
            add=$(wait_for_label "$probe/settings.png" 'Add Controls' 800 850 25) || continue
            cliclick "c:$add"
            category=$(wait_for_label artifacts/add-controls.png 'Fast User' 600 800 15) || category=713,357
            cliclick "c:$category"
            /bin/sleep 4
            capture artifacts/fast-user-switching-control.png || continue
            cliclick rc:969,134
            /bin/sleep 1
            capture artifacts/control-context-menu.png || true
            if direct=$(find_label artifacts/control-context-menu.png 'Add to Menu Bar' 800 430); then
              cliclick "c:$direct"
              echo 'USER_SWITCH_CONTROL_ADDED_FROM_CONTEXT_MENU'
            else
              cliclick c:1210,260
              cliclick -w 250 m:969,134 dd:969,134 dm:985,130 dm:1120,105 dm:1390,55 dm:1570,26 "dm:$destination,14" "du:$destination,14"
            fi
            /bin/sleep 3
            cliclick c:1277,912
            /bin/sleep 2
            menu_items > artifacts/menu-bar-controls.txt || true
            grep -q 'User' artifacts/menu-bar-controls.txt && break
          done
          relative_tile=$(/usr/bin/osascript <<'APPLESCRIPT'
          tell application "System Events" to tell process "ControlCenter"
            set switcher to first menu bar item of menu bar 1 whose description is "User"
            set {leftEdge, topEdge} to position of switcher
            set {itemWidth, itemHeight} to size of switcher
            click switcher
            return ((leftEdge + (itemWidth div 2) - 203) as text) & ",70"
          end tell
          APPLESCRIPT
          )
          echo 'USER_SWITCH_MENU_OPENED'
          capture artifacts/fast-user-menu.png || true
          /usr/bin/osascript <<'APPLESCRIPT' > artifacts/login-window-menu-accessibility.txt || true
          tell application "System Events" to tell process "ControlCenter"
            set summary to ""
            repeat with windowRef in windows
              set currentWindow to contents of windowRef
              set candidates to (buttons of currentWindow) & (entire contents of currentWindow)
              repeat with itemRef in candidates
                try
                  set itemElement to contents of itemRef
                  set roleLabel to get role of itemElement
                  set labelText to ""
                  try
                    set labelText to get name of itemElement as text
                  end try
                  try
                    set labelText to labelText & " " & (get description of itemElement as text)
                  end try
                  if labelText is not "" then set summary to summary & roleLabel & " " & labelText & linefeed
                  if (roleLabel is "AXButton" or roleLabel is "AXMenuItem") and labelText contains "Login Window" then
                    perform action "AXPress" of itemElement
                    return "PRESSED" & linefeed & summary
                  end if
                end try
              end repeat
            end repeat
            return summary
          end tell
          APPLESCRIPT
          if ! grep -q '^PRESSED' artifacts/login-window-menu-accessibility.txt; then
            point=$(wait_for_label artifacts/fast-user-menu.png 'Login Window' 1300 200 15) || {
              x=${relative_tile%,*}
              point="$((x - 72)),157"
            }
            printf '%s\n' "$point" > artifacts/login-window-menu-point.txt
            cliclick "c:$point"
          fi
          echo 'LOGIN_WINDOW_REQUESTED'
          /bin/sleep 2
          stat -f '%Su' /dev/console > artifacts/console-user-after-switch-request.txt
          /usr/sbin/ioreg -n Root -d 1 | grep 'IOConsoleUsers' > artifacts/console-session-after-switch-request.txt || true
          account_tile=$(wait_for_label artifacts/test-administrator-login.png 'Connector' 600 1020 28)
          printf '%s\n' "$account_tile" > artifacts/confirmed-login-account-label.txt
          cliclick "c:$account_tile"
          echo 'TEST_ADMINISTRATOR_SELECTED'
          wait_for_label artifacts/test-administrator-login.png 'Connector' 600 1020 15 >/dev/null
          field=$(wait_for_label artifacts/test-administrator-login.png 'Enter Password' 600 1030 15)
          echo 'TEST_ADMINISTRATOR_PASSWORD_FIELD_CONFIRMED'
          cliclick "c:$field"
          {
            printf 'tell application "System Events"\n'
            printf 'repeat with c in characters of "%s"\nkeystroke (contents of c)\ndelay 0.08\nend repeat\n' "$password"
            printf 'key code 36\nend tell\n'
          } | /usr/bin/osascript - >/dev/null 2>&1
          unset password
          for second in {1..45}; do
            if [[ $(stat -f '%Su' /dev/console) == "$account" ]] && sudo -n /bin/launchctl print "gui/$uid" >/dev/null 2>&1; then
              echo 'DISPOSABLE_ADMIN_GUI_LOGIN_VERIFIED'
              break
            fi
            /bin/sleep 1
          done
          stat -f '%Su' /dev/console | tee artifacts/current-console-user.txt
          sudo -n /bin/launchctl print "gui/$uid" > artifacts/administrator-gui-status.txt 2>&1 || true
          sysadminctl -secureTokenStatus "$account" > artifacts/secure-token-after.txt 2>&1
          test "$(stat -f '%Su' /dev/console)" = "$account"
          sudo -n /bin/launchctl print "gui/$uid" >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intel-console-login-evidence
          path: artifacts/
