name: Intel macOS 26 production desktop acceptance
on:
  workflow_dispatch:
    inputs:
      compare_http_transfer:
        description: Fetch the exact installer with the browser session to isolate the downstream flow
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  desktop:
    runs-on: macos-26-intel
    timeout-minutes: 10
    env:
      CIO_E2E_OUTPUT: artifacts/macos-user-flow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Prepare a fresh graphical browser
        run: |
          test "$(uname -m)" = x86_64
          sw_vers
          test "$(stat -f '%Su' /dev/console)" = "$(id -un)"
          launchctl print "gui/$(id -u)" >/dev/null
          npm install --no-save playwright@1.63.0
          npx playwright install chromium
          which cliclick || brew install cliclick
      - name: Run the real desktop flow against production
        env:
          CIO_DESKTOP_NATIVE_CHROME: '1'
          CIO_DESKTOP_COMPARE_HTTP_TRANSFER: ${{ inputs.compare_http_transfer && '1' || '0' }}
        run: |
          service="gui/$(id -u)/com.apple.iconservices.iconservicesagent"
          mkdir -p "$CIO_E2E_OUTPUT"
          launchctl print "$service" > "$CIO_E2E_OUTPUT/iconservices-before.txt" 2>&1 || true
          cleanup_test_machine() {
            launchctl enable "$service" || true
            sudo -n /usr/sbin/sysadminctl -deleteUser cioinstallqa >/dev/null 2>&1 || true
          }
          trap cleanup_test_machine EXIT
          /usr/bin/python3 - "$service" <<'PY'
          import subprocess
          import sys

          service = sys.argv[1]
          for verb in ('bootout', 'disable'):
              try:
                  subprocess.run(['/bin/launchctl', verb, service], check=True, timeout=12)
              except (subprocess.CalledProcessError, subprocess.TimeoutExpired) as error:
                  print(f'ICON_SERVICES_{verb.upper()}_FAILED: {error}', flush=True)
                  raise SystemExit(1)
              print(f'ICON_SERVICES_{verb.upper()}_OK', flush=True)
          PY
          if [ "$CIO_DESKTOP_COMPARE_HTTP_TRANSFER" != 1 ]; then
            CIO_TEST_VM_ADMIN_PASSWORD="$(/usr/bin/openssl rand -hex 20)"
            export CIO_TEST_VM_ADMIN_PASSWORD
            echo "::add-mask::$CIO_TEST_VM_ADMIN_PASSWORD"
          fi
          node scripts/verify-macos-intel-desktop.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intel-production-desktop-evidence
          path: artifacts/macos-user-flow/
